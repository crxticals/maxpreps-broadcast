[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxpreps-broadcast"
version = "1.0.0"
description = "Resilient MaxPreps data client and broadcast-graphics export layer for After Effects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NTV Broadcast" }]
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
    "beautifulsoup4>=4.12",
    "Pillow>=10.3",
    "tzdata>=2024.1",  # zoneinfo has no system tz database on Windows / slim containers
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML",
    "types-beautifulsoup4",
]

[project.scripts]
maxpreps = "maxpreps_broadcast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/maxpreps_broadcast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/maxpreps_broadcast"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "SIM117", "B008", "RUF001", "RUF002", "UP042"]  # ternaries, nested-with, typer defaults, intentional broadcast typography (– —), str-Enum kept for pydantic v2 serialization

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["maxpreps_broadcast"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true
